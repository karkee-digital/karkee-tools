
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | KARKEE TOOLS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

<div class="container min-vh-100 d-flex justify-content-center align-items-center">
    <div class="card shadow-sm border-0 p-4" style="max-width: 420px; width: 100%;">

        <h3 class="text-center fw-bold mb-2">KARKEE TOOLS</h3>
        <p class="text-center text-muted mb-4">Admin Login</p>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" id="email" class="form-control"
                       placeholder="Enter admin email" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control"
                       placeholder="Enter password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100" id="loginBtn">
                Login
            </button>

            <p id="loginMessage" class="text-center mt-3 mb-0"></p>
        </form>

        <p class="text-center text-muted small mt-4 mb-0">
            By Karkee Digital Studio
        </p>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/admin-login.js"></script>

</body>
</html>
