
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Tools | KARKEE TOOLS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-light">


<nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container">

        <a class="navbar-brand fw-bold" href="dashboard.html">
            KARKEE TOOLS
        </a>

        <div class="d-flex gap-2">
            <a href="dashboard.html" class="btn btn-outline-secondary btn-sm">
                Dashboard
            </a>

            <button class="btn btn-outline-danger btn-sm" id="logoutBtn">
                Logout
            </button>
        </div>

    </div>
</nav>


<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold">Manage Tools</h2>
            <p class="text-muted mb-0">Add and manage your website tools.</p>
        </div>
    </div>

    <!-- Add Tool Form -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body p-4">

            <h4 class="mb-4" id="formTitle">Add New Tool</h4>

            <form id="toolForm">

                <input type="hidden" id="toolId">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Tool Name</label>
                        <input type="text" id="toolName" class="form-control"
                               placeholder="Example: Word Counter" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Tool Slug</label>
                        <input type="text" id="toolSlug" class="form-control"
                               placeholder="Example: word-counter" required>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Description</label>
                        <textarea id="toolDescription" class="form-control"
                                  rows="3" placeholder="Describe your tool"></textarea>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Category</label>
                        <select id="toolCategory" class="form-select" required>
                            <option value="">Select Category</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Tool Page URL</label>
                        <input type="text" id="toolUrl" class="form-control"
                               placeholder="../tools/word-counter.html" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Thumbnail Image</label>
                        <input type="file" id="toolThumbnail"
                               class="form-control" accept="image/png,image/jpeg,image/webp">
                        <small class="text-muted">PNG, JPG or WebP. Maximum 2 MB.</small>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Thumbnail Preview</label>
                        <img id="thumbnailPreview" src="" alt="Thumbnail preview"
                             style="display:none; max-height:100px; max-width:150px;"
                             class="d-block rounded">
                    </div>

                    <div class="col-md-6">
                        <div class="form-check mt-3">
                            <input type="checkbox" id="isFeatured" class="form-check-input">
                            <label class="form-check-label" for="isFeatured">
                                Featured Tool
                            </label>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-check mt-3">
                            <input type="checkbox" id="isPublished" class="form-check-input">
                            <label class="form-check-label" for="isPublished">
                                Publish Tool
                            </label>
                        </div>
                    </div>

                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-primary" id="saveToolBtn">
                        Save Tool
                    </button>

                    <button type="button" class="btn btn-outline-secondary"
                            id="cancelEditBtn">
                        Clear Form
                    </button>
                </div>

                <p id="formMessage" class="mt-3 mb-0"></p>

            </form>
        </div>
    </div>

    <!-- Tools List -->
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">

            <h4 class="mb-3">Existing Tools</h4>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Tool Name</th>
                            <th>Category</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="toolsTableBody">
                        <tr>
                            <td colspan="4" class="text-center text-muted">
                                Tools will load here.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/admin-logout.js"></script>
<script src="../js/manage-tools.js"></script>

</body>
</html>
