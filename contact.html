
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | KARKEE TOOLS</title>
    <meta name="description" content="Contact KARKEE TOOLS for questions, feedback and suggestions.">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <!-- Cloudflare Turnstile -->
    <script
        src="https://challenges.cloudflare.com/turnstile/v0/api.js"
        async
        defer>
    </script>
</head>

<body>

<nav class="navbar bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
            KARKEE TOOLS
        </a>
        <a href="index.html" class="btn btn-outline-primary">Home</a>
    </div>
</nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">

            <div class="text-center mb-4">
                <span class="badge bg-primary-subtle text-primary p-2">
                    GET IN TOUCH
                </span>

                <h1 class="fw-bold mt-3">Contact Us</h1>

                <p class="text-muted">
                    Have a question, suggestion or feedback? Contact us.
                </p>
            </div>

            <div class="card border-0 shadow-sm p-4">

                <form id="contactForm">

                    <div class="mb-3">
                        <label for="name" class="form-label">Your Name</label>
                        <input
                            type="text"
                            class="form-control"
                            id="name"
                            maxlength="100"
                            required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            maxlength="254"
                            required>
                    </div>

                    <div class="mb-3">
                        <label for="subject" class="form-label">Subject</label>
                        <input
                            type="text"
                            class="form-control"
                            id="subject"
                            maxlength="150"
                            required>
                    </div>

                    <div class="mb-3">
                        <label for="message" class="form-label">Message</label>
                        <textarea
                            class="form-control"
                            id="message"
                            rows="5"
                            maxlength="5000"
                            required></textarea>
                    </div>

                    <!-- Cloudflare Turnstile -->
                    <div class="mb-3">
                        <div
                            class="cf-turnstile"
                            data-sitekey="0x4AAAAAAFwbYkalBJN923ef"
                            data-theme="light">
                        </div>
                    </div>

                    <button
                        type="submit"
                        id="submitBtn"
                        class="btn btn-primary w-100">
                        Send Message
                    </button>

                    <div
                        id="formMessage"
                        class="alert mt-3 mb-0 d-none"
                        role="status"
                        aria-live="polite">
                    </div>

                </form>

            </div>
        </div>
    </div>
</main>

<footer class="site-footer">
    <div class="container py-4 text-center">
        <p class="mb-1">
            © 2026 KARKEE TOOLS. All rights reserved.
        </p>
        <small>By Karkee Digital Studio</small>
    </div>
</footer>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

<!-- Website Analytics -->
<script src="js/analytics.js"></script>

<script>
const contactForm = document.getElementById("contactForm");
const formMessage = document.getElementById("formMessage");
const submitBtn = document.getElementById("submitBtn");

function showMessage(message, type) {
    formMessage.textContent = message;
    formMessage.className = `alert alert-${type} mt-3 mb-0`;

    formMessage.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
    });
}

async function getFunctionError(error) {
    if (error?.context instanceof Response) {
        try {
            const responseData = await error.context.clone().json();

            if (responseData?.error) {
                return {
                    message: responseData.error,
                    status: error.context.status
                };
            }
        } catch (parseError) {
            console.error("Could not parse function error:", parseError);
        }

        return {
            message: error.message,
            status: error.context.status
        };
    }

    return {
        message: error?.message || "Unable to submit your message.",
        status: null
    };
}

contactForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    if (!contactForm.reportValidity()) {
        return;
    }

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const subject = document.getElementById("subject").value.trim();
    const message = document.getElementById("message").value.trim();

    if (!name || !email || !subject || !message) {
        showMessage("Please fill in all fields.", "danger");
        return;
    }

    const turnstileField = document.querySelector(
        '[name="cf-turnstile-response"]'
    );

    const turnstileToken = turnstileField?.value;

    if (!turnstileToken) {
        showMessage(
            "Please complete the security verification.",
            "warning"
        );
        return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Sending...";
    formMessage.classList.add("d-none");

    try {

        const { data, error } =
            await supabaseClient.functions.invoke(
                "contact-notification",
                {
                    body: {
                        name,
                        email,
                        subject,
                        message,
                        turnstileToken
                    }
                }
            );

        if (error) {

            console.error("Contact function error:", error);

            const functionError = await getFunctionError(error);

            if (functionError.status === 429) {
                showMessage(
                    "Too many submissions. Please try again after 15 minutes.",
                    "warning"
                );
            } else {
                showMessage(
                    functionError.message ||
                    "Unable to submit your message. Please try again.",
                    "danger"
                );
            }

            return;
        }

        if (data?.success === true && data?.emailSent === true) {

            showMessage(
                "Your message was submitted successfully!",
                "success"
            );

            contactForm.reset();

        } else if (data?.success === true && data?.emailSent === false) {

            showMessage(
                "Your message was saved, but the email notification could not be sent.",
                "warning"
            );

            contactForm.reset();

        } else {

            showMessage(
                data?.error || "Unable to submit your message. Please try again.",
                data?.error ? "warning" : "danger"
            );
        }

    } catch (error) {

        console.error("Contact form error:", error);

        showMessage(
            "Unable to submit your message. Please try again.",
            "danger"
        );

    } finally {

        if (window.turnstile) {
            window.turnstile.reset();
        }

        submitBtn.disabled = false;
        submitBtn.textContent = "Send Message";

    }

});
</script>

</body>
</html>
